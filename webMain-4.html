(--mu)}\n<\/style><\/head>\n<body>\n<div class=\"app\">\n  <div class=\"top\"><h1 id=\"ttl\">Roulette<\/h1><div class=\"hist\" id=\"hist\"><\/div><div class=\"bal\">Saldo <b id=\"bal\"><\/b><\/div><\/div>\n  <div class=\"wheelWrap\">\n    <canvas id=\"wheel\" width=\"260\" height=\"260\"><\/canvas>\n    <div class=\"res\" id=\"res\"><\/div>\n    <div class=\"timer\"><i id=\"bar\"><\/i><\/div>\n  <\/div>\n  <div class=\"board\">\n    <div class=\"numsWrap\"><div class=\"nums\" id=\"nums\"><\/div><\/div>\n    <div class=\"numsWrap\"><div class=\"outside\" id=\"outside\"><\/div><\/div>\n  <\/div>\n  <div class=\"chips\">\n    <button class=\"chipbtn\" data-v=\"2000\">2K<\/button><button class=\"chipbtn on\" data-v=\"10000\">10K<\/button>\n    <button class=\"chipbtn\" data-v=\"20000\">20K<\/button><button class=\"chipbtn\" data-v=\"50000\">50K<\/button>\n    <button id=\"clr\">Hapus<\/button><button id=\"redo\">Ulang bet<\/button>\n  <\/div>\n  <div class=\"msg\" id=\"msg\">Klik chip lalu klik nomor atau taruhan luar sebelum waktu habis.<\/div>\n<\/div>\n<div id=\"admin\" role=\"dialog\" aria-label=\"Admin panel\">\n  <h2>Admin panel <button id=\"ax\" style=\"padding:5px 9px;font-size:12px\">Tutup<\/button><\/h2>\n  <div id=\"lg\" class=\"row\"><input type=\"password\" id=\"pin\" placeholder=\"PIN admin\"><button id=\"pb\" class=\"au\">Masuk<\/button><\/div>\n  <div id=\"abody\" style=\"display:none;gap:8px\">\n    <label class=\"row\"><input type=\"checkbox\" id=\"pk\"> Intip hasil ronde berikutnya (On/Off)<\/label>\n    <div class=\"st\" id=\"pv\"><\/div>\n    <div class=\"row\"><input type=\"number\" id=\"add\" min=\"1\" placeholder=\"tambah saldo\"><button id=\"addb\" class=\"au\">Tambah<\/button><\/div>\n    <button id=\"rs\">Reset saldo<\/button>\n    <div class=\"st\" id=\"stats\"><\/div>\n  <\/div>\n<\/div>\n<script>\n// Roulette Eropa (0-36, satu zero). Semua pembayaran & peluang standar, hasil murni acak.\nconst C={PIN:\"1234\",START:1000000,BET_SEC:12};\nconst WHEEL=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];\nconst RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);\nconst $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst fmt=n=>Math.floor(n).toLocaleString(\"id-ID\"),say=t=>$(\"msg\").textContent=t;\nconst S=window.__st={bal:(parent.HUBW??C.START),chip:10000,bets:{},last:null,open:false,hist:[],spins:0,paidOut:0,wagered:0,peek:false,plan:0};\nconst isRed=n=>RED.has(n),color=n=>n===0?\"g\":isRed(n)?\"r\":\"b\";\nconst betTotal=()=>Object.values(S.bets).reduce((s,v)=>s+v,0);\n\n// ---------- papan nomor ----------\nconst numsEl=$(\"nums\");\nfor(let n=1;n<=36;n++){const b=document.createElement(\"button\");b.className=\"n \"+(isRed(n)?\"r\":\"b\");\n  b.textContent=n;b.dataset.k=\"n\"+n;numsEl.appendChild(b)}\nconst zero=document.createElement(\"button\");zero.className=\"n g\";zero.textContent=\"0\";zero.dataset.k=\"n0\";\nnumsEl.insertBefore(zero,numsEl.firstChild);\n\nconst OUTSIDE=[[\"Merah\",\"red\"],[\"Hitam\",\"black\"],[\"Ganjil\",\"odd\"],[\"Genap\",\"even\"],[\"1-18\",\"low\"],[\"19-36\",\"high\"],\n  [\"1st 12\",\"d1\"],[\"2nd 12\",\"d2\"],[\"3rd 12\",\"d3\"],[\"Kolom 1\",\"c1\"],[\"Kolom 2\",\"c2\"],[\"Kolom 3\",\"c3\"]];\nconst outEl=$(\"outside\");\nOUTSIDE.forEach(([label,k])=>{const b=document.createElement(\"button\");b.className=\"o\";b.textContent=label;b.dataset.k=k;outEl.appendChild(b)});\n\nfunction payoutMult(k,n){\n  if(k[0]===\"n\")return +k.slice(1)===n?36:0;\n  if(k===\"red\")return isRed(n)?2:0;\n  if(k===\"black\")return(n>0&&!isRed(n))?2:0;\n  if(k===\"odd\")return(n>0&&n%2===1)?2:0;\n  if(k===\"even\")return(n>0&&n%2===0)?2:0;\n  if(k===\"low\")return(n>=1&&n<=18)?2:0;\n  if(k===\"high\")return(n>=19&&n<=36)?2:0;\n  if(k===\"d1\")return(n>=1&&n<=12)?3:0;\n  if(k===\"d2\")return(n>=13&&n<=24)?3:0;\n  if(k===\"d3\")return(n>=25&&n<=36)?3:0;\n  if(k===\"c1\")return(n>0&&n%3===1)?3:0;\n  if(k===\"c2\")return(n>0&&n%3===2)?3:0;\n  if(k===\"c3\")return(n>0&&n%3===0)?3:0;\n  return 0;\n}\nfunction labelWin(k){return document.querySelector(`[data-k=\"${k}\"]`)}\n\n// ---------- roda ----------\nconst cv=$(\"wheel\"),x=cv.getContext(\"2d\"),R=124,CX=130,CY=130;\nlet rot=0;\nfunction drawWheel(){\n  x.clearRect(0,0,260,260);\n  const seg=2*Math.PI/WHEEL.length;\n  WHEEL.forEach((n,i)=>{x.beginPath();x.moveTo(CX,CY);\n    x.arc(CX,CY,R,rot+i*seg,rot+(i+1)*seg);x.closePath();\n    x.fillStyle=n===0?\"#2fd67b\":isRed(n)?\"#d81f3a\":\"#151515\";x.fill();x.strokeStyle=\"#0006\";x.stroke();\n    x.save();x.translate(CX,CY);x.rotate(rot+(i+.5)*seg);x.textAlign=\"right\";x.fillStyle=\"#fff\";x.font=\"10px sans-serif\";\n    x.fillText(n,R-4,4);x.restore()});\n  x.beginPath();x.arc(CX,CY,18,0,7);x.fillStyle=\"#0c1a12\";x.fill();x.strokeStyle=\"#ffc94d\";x.stroke();\n  x.beginPath();x.moveTo(CX,CY-R-6);x.lineTo(CX-8,CY-R+10);x.lineTo(CX+8,CY-R+10);x.closePath();x.fillStyle=\"#ffc94d\";x.fill();\n}\ndrawWheel();\n\n// ---------- taruhan ----------\nfunction ui(){\n  $(\"bal\").textContent=fmt(S.bal);\n  document.querySelectorAll(\".n,.o\").forEach(el=>{const v=S.bets[el.dataset.k];\n    let ch=el.querySelector(\".chip\");\n    if(v){if(!ch){ch=document.createElement(\"span\");ch.className=\"chip\";el.appendChild(ch)}ch.textContent=v>=1000?Math.round(v/1000)+\"K\":v}\n    else if(ch)ch.remove()});\n  document.querySelectorAll(\".n,.o\").forEach(el=>el.disabled=!S.open);\n  $(\"clr\").disabled=!S.open;$(\"redo\").disabled=!S.open||!S.last;\n  $(\"hist\").innerHTML=S.hist.slice(0,16).map(n=>`<span class=\"bead ${color(n)}\" style=\"background:${color(n)==='g'?'var(--gr)':color(n)==='r'?'var(--rd)':'var(--bk)'};${color(n)==='g'?'color:#032414':''}\">${n}<\/span>`).join(\"\");\n  const rtp=S.wagered?(S.paidOut/S.wagered*100).toFixed(1):\"0.0\";\n  $(\"stats\").textContent=`Putaran: ${S.spins} | RTP sesi: ${rtp}%`;\n  // simpan saldo + taruhan yang sedang terpasang, supaya tidak hilang kalau halaman di-refresh\n  try{localStorage.setItem(\"roulette_v1\",JSON.stringify({b:S.bal+betTotal(),chip:S.chip}))}catch(e){}}\n\n// Taruhan langsung memotong saldo\nfunction place(k,a){if(!S.open||a<1)return;\n  if(a>S.bal)return say(\"Saldo kurang.\");\n  S.bal-=a;S.bets[k]=(S.bets[k]||0)+a;ui()}\n// Kembalikan semua taruhan yang belum diputar ke saldo\nfunction refundBets(){S.bal+=betTotal();S.bets={}}\n\ndocument.querySelectorAll(\".n,.o\").forEach(el=>el.onclick=()=>place(el.dataset.k,S.chip));\ndocument.querySelectorAll(\".chipbtn\").forEach(c=>c.onclick=()=>{S.chip=+c.dataset.v;\n  document.querySelectorAll(\".chipbtn\").forEach(b=>b.classList.toggle(\"on\",b===c))});\n$(\"clr\").onclick=()=>{if(!S.open)return;refundBets();ui()};\n$(\"redo\").onclick=()=>{if(!S.open||!S.last)return;refundBets();for(const k in S.last)place(k,S.last[k]);ui()};\n\n// ---------- ronde ----------\nfunction planNext(){S.plan=WHEEL[Math.floor(Math.random()*WHEEL.length)];adm()}\nasync function round(){\n  S.bets={};$(\"res\").textContent=\"\";document.querySelectorAll(\".win\").forEach(e=>e.classList.remove(\"win\"));\n  S.open=true;say(\"Pasang taruhan lu!\");ui();\n  $(\"bar\").style.transition=\"none\";$(\"bar\").style.width=\"100%\";\n  await sleep(50);$(\"bar\").style.transition=`width ${C.BET_SEC}s linear`;$(\"bar\").style.width=\"0\";\n  await sleep(C.BET_SEC*1000);\n  S.open=false;S.pending=true;ui();say(\"Bola dilempar...\");\n\n  const n=S.plan;\n  const idx=WHEEL.indexOf(n),seg=2*Math.PI/WHEEL.length;\n  const targetRot=-Math.PI/2-(idx+.5)*seg;\n  const spins=6,start=rot,end=start+spins*2*Math.PI+((targetRot-start)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);\n  const dur=2600,t0=performance.now();\n  await new Promise(res=>{function frame(now){const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,3);\n    rot=start+(end-start)*e;drawWheel();if(t<1)requestAnimationFrame(frame);else res()}requestAnimationFrame(frame)});\n\n  // Taruhan sudah dipotong saat dipasang, jadi di sini hanya menambah pengembalian (taruhan x pengali)\n  const staked=betTotal();\n  let win=0;\n  for(const k in S.bets){const a=S.bets[k],m=payoutMult(k,n);if(m){win+=a*m;labelWin(k)?.classList.add(\"win\")}}\n  S.bal+=win;S.pending=false;S.wagered+=staked;S.paidOut+=win;S.spins++;\n  S.hist.unshift(n);\n  $(\"res\").textContent=`Keluar ${n} (${color(n)==='g'?'Zero':color(n)==='r'?'Merah':'Hitam'})`;\n  say(staked===0?\"Tidak ada taruhan.\":win>0?\"Menang \"+fmt(win)+\"! (bersih \"+(win-staked>=0?\"+\":\"\")+fmt(win-staked)+\")\":\"Kalah \"+fmt(staked)+\".\");\n  S.last=Object.keys(S.bets).length?{...S.bets}:S.last;\n  planNext();ui();\n  await sleep(3000);\n}\n\n// ---------- admin ----------\n// Buka/tutup panel dengan klik 3x cepat di tulisan \"Roulette\"\nlet tap=0,tapTimer;\n$(\"ttl\").onclick=()=>{\n  tap++;clearTimeout(tapTimer);\n  tapTimer=setTimeout(()=>tap=0,600);\n  if(tap>=3){tap=0;$(\"admin\").classList.toggle(\"open\")}\n};\n$(\"ax\").onclick=()=>$(\"admin\").classList.remove(\"open\");\n$(\"pb\").onclick=()=>{if($(\"pin\").value===C.PIN){$(\"lg\").style.display=\"none\";$(\"abody\").style.display=\"grid\"}\n  else{$(\"pin\").value=\"\";$(\"pin\").placeholder=\"PIN salah\"}};\n$(\"addb\").onclick=()=>{const n=Math.floor($(\"add\").value);if(n>0){S.bal+=n;$(\"add\").value=\"\";ui()}};\n$(\"rs\").onclick=()=>{S.bets={};S.bal=3000;S.spins=S.paidOut=S.wagered=0;ui()};\nfunction adm(){$(\"pv\").textContent=S.peek?\"Angka berikutnya: \"+S.plan+\" (\"+(color(S.plan)==='g'?'Zero':color(S.plan)==='r'?'Merah':'Hitam')+\")\":\"Hasil disembunyiin (nyalain Intip)\"}\n$(\"pk\").onchange=e=>{S.peek=e.target.checked;adm()};\n\ntry{const d=JSON.parse(localStorage.getItem(\"roulette_v1\"));if(d){S.bal=(parent.HUBW??d.b);S.chip=d.chip||10000;\n  document.querySelectorAll(\".chipbtn\").forEach(c=>c.classList.toggle(\"on\",+c.dataset.v===S.chip))}}catch(e){}\n// dipanggil hub saat keluar: taruhan yang belum diputar dibalikin, yang lagi diputar dihitung sesuai hasil\nwindow.__leave=function(){\n  if(!betTotal())return;\n  if(S.open){refundBets()}\n  else if(S.pending){let win=0;for(const k in S.bets){const m=payoutMult(k,S.plan);if(m)win+=S.bets[k]*m}\n    S.bal+=win;S.bets={};S.pending=false}\n};\nplanNext();ui();\n(async()=>{for(;;)await round()})();\n<\/script><\/body><\/html>"}, {"t": "Roulette Simulasi", "d": "Versi simulasi", "i": "🎰", "h": "<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Roulette<\/title>\n<style>\n:root{--bg:#f1ede4;--felt:#e2dccd;--ink:#1d2a2a;--mute:#5d6a68;--brass:#8a6a17;--red:#a3243a;--blk:#1d2a2a;--grn:#1f7a4d;--line:#c9c1ab;--card:#fffdf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0b1f20;--felt:#10302f;--ink:#f0e9d8;--mute:#9db0ab;--brass:#d4ac4a;--red:#c4374d;--blk:#050c0c;--grn:#22935c;--line:#25504d;--card:#0a1919}}\n:root[data-theme=\"dark\"]{--bg:#0b1f20;--felt:#10302f;--ink:#f0e9d8;--mute:#9db0ab;--brass:#d4ac4a;--red:#c4374d;--blk:#050c0c;--grn:#22935c;--line:#25504d;--card:#0a1919}\n*,*:before,*:after{box-sizing:inherit}\n[hidden]{display:none!important}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Trebuchet MS\",\"Segoe UI\",system-ui,sans-serif;display:flex;justify-content:center}\nmain{width:100%;max-width:560px;padding:18px 14px 32px}\nh1{font-family:Georgia,\"Times New Roman\",serif;font-size:1.5rem;margin:0}\n.top{display:flex;justify-content:space-between;align-items:center}\n.badge{font-size:.75rem;color:var(--mute);margin:2px 0 14px}\nbutton,input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}\nbutton{cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}\n.foot{margin-top:18px;text-align:left}\n.foot button{font-size:.7rem;padding:3px 8px;border-radius:8px;color:var(--mute)}\n.bal{margin-top:14px;background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline}\n.bal b{font-size:1.5rem;color:var(--brass);font-variant-numeric:tabular-nums}\n.stage{display:flex;align-items:center;gap:14px;margin:14px 0;background:var(--felt);border:2px solid var(--brass);border-radius:20px;padding:12px}\n.wheelbox{position:relative;width:170px;flex:none}\n.wheelbox:before{content:\"\";position:absolute;left:50%;top:-4px;transform:translateX(-50%);border:7px solid transparent;border-top:12px solid var(--brass);z-index:2}\n#wheel{width:100%;display:block;transition:transform 4.2s cubic-bezier(.12,.6,.1,1)}\n.res{flex:1;text-align:center}\n.big{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:700;color:#fff;background:var(--felt);border:2px solid var(--line)}\n.msg{min-height:2.6em;font-weight:700}.msg.win{color:var(--brass)}.msg.lose{color:var(--mute)}\n.hist{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px}\n.hist span{width:24px;height:24px;border-radius:50%;font-size:.7rem;display:flex;align-items:center;justify-content:center;color:#fff}\n.c-r{background:var(--red)}.c-b{background:var(--blk)}.c-g{background:var(--grn)}\n.table{background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:8px}\n.nums{display:grid;grid-template-columns:34px repeat(12,1fr);gap:3px}\n.cell{position:relative;padding:0;height:36px;border-radius:6px;color:#fff;border:1px solid var(--line);font-size:.8rem;font-weight:700}\n.zero{grid-row:span 3;height:auto}\n.out{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:3px}\n.out2{grid-template-columns:repeat(6,1fr)}\n.out .cell{color:var(--ink);background:var(--card);height:34px;font-size:.75rem}\n.chip{position:absolute;right:-3px;top:-6px;background:var(--brass);color:var(--card);border-radius:10px;font-size:.6rem;padding:1px 4px;line-height:1.2;pointer-events:none}\n.chips{display:flex;gap:6px;margin:12px 0 8px;align-items:center;flex-wrap:wrap}\n.chips button.on{background:var(--brass);color:var(--card);border-color:var(--brass);font-weight:700}\n.act{display:flex;gap:8px}.act button{flex:1}\n#spin{flex:2;padding:13px;font-weight:700;font-size:1.05rem;background:var(--red);border-color:var(--red);color:#fff}\n#spin:disabled{opacity:.5;cursor:default}\n.pay{font-size:.75rem;color:var(--mute);text-align:center;margin-top:10px;line-height:1.5}\n#adm{display:none;margin-top:16px;border:1px dashed var(--red);border-radius:14px;padding:14px;background:var(--felt)}\n#adm.open{display:block}\n#adm h2{margin:0 0 10px;font-size:1rem;color:var(--red)}\n.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}\n.row label{font-size:.85rem;color:var(--mute);min-width:100px}\ninput[type=number]{width:110px}\n.peek{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:1.8rem;font-weight:700}\n.peek small{display:block;font-size:.75rem;font-weight:400;color:var(--mute);margin-top:2px}\n.log{font-size:.75rem;color:var(--mute);max-height:90px;overflow:auto;margin-top:8px}\ndialog{border:1px solid var(--line);border-radius:14px;background:var(--felt);color:var(--ink)}\n@media (max-width:440px){.stage{flex-direction:column}.wheelbox{width:150px}.cell{font-size:.7rem;height:32px}}\n@media (prefers-reduced-motion:reduce){#wheel{transition-duration:.01s}}\n<\/style>\n<\/head>\n<body>\n<main>\n  <div class=\"top\"><h1>Roulette<\/h1><\/div>\n  <div class=\"bal\"><span>Saldo<\/span><b id=\"bal\">1.000.000<\/b><\/div>\n\n  <div class=\"stage\">\n    <div class=\"wheelbox\"><svg id=\"wheel\" viewBox=\"-100 -100 200 200\" aria-hidden=\"true\"><\/svg><\/div>\n    <div class=\"res\">\n      <div class=\"big\" id=\"big\">?<\/div>\n      <div class=\"msg\" id=\"msg\" aria-live=\"polite\">Pasang chip di meja, lalu putar.<\/div>\n      <div class=\"hist\" id=\"hist\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"table\">\n    <div class=\"nums\" id=\"nums\"><\/div>\n    <div class=\"out\" id=\"dz\"><\/div>\n    <div class=\"out out2\" id=\"oo\"><\/div>\n  <\/div>\n\n  <div class=\"chips\" id=\"chips\"><span>Chip:<\/span><\/div>\n  <div class=\"act\"><button id=\"undo\">Batalkan<\/button><button id=\"clear\">Hapus semua<\/button><button id=\"spin\">Putar<\/button><\/div>\n  <p class=\"pay\">Angka tunggal 35:1 · Lusin 2:1 · Merah/Hitam, Ganjil/Genap, 1–18/19–36 1:1 · Roda Eropa (0–36)<\/p>\n\n  <section id=\"adm\" aria-label=\"Panel admin\">\n    <h2>Panel admin<\/h2>\n    <div class=\"peek\" id=\"peek\">–<small>Hasil putaran berikutnya<\/small><\/div>\n    <div class=\"row\"><label for=\"mode\">Mode hasil<\/label>\n      <select id=\"mode\">\n        <option value=\"auto\">Acak<\/option>\n        <option value=\"win\">Paksa menang (sesuai taruhan)<\/option>\n        <option value=\"lose\">Paksa kalah (sesuai taruhan)<\/option>\n        <option value=\"fix\">Tentukan angka<\/option>\n      <\/select><\/div>\n    <div class=\"row\" id=\"fixRow\" hidden><label for=\"fixN\">Angka<\/label><select id=\"fixN\"><\/select><\/div>\n    <div class=\"row\"><label for=\"add\">Tambah saldo<\/label><input id=\"add\" type=\"number\" min=\"1000\" step=\"1000\" value=\"500000\"><button id=\"addBtn\">Tambah<\/button><\/div>\n    <div class=\"row\"><label for=\"sub\">Kurangi saldo<\/label><input id=\"sub\" type=\"number\" min=\"1000\" step=\"1000\" value=\"100000\"><button id=\"subBtn\">Kurangi<\/button><\/div>\n    <div class=\"row\"><button id=\"reset\">Reset saldo ke 3.000<\/button><\/div>\n    <div class=\"log\" id=\"log\"><\/div>\n  <\/section>\n  <div class=\"foot\"><button id=\"admBtn\
